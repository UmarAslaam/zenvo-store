<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop | Zenvo</title>
<meta name="description" content="Zenvo - smart gear for people on the move.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link rel="icon" href="favicon.svg" type="image/svg+xml"><meta name="theme-color" content="#14123A">
<link href="css/style.css" rel="stylesheet">
</head>
<body data-page="shop">
<div id="site-header"></div>
<main id="main">
<section class="page-head"><div class="container"><nav class="crumb small mb-2"><a href="index.html">Home</a> / Shop</nav><h1>Shop</h1><p>Browse all products, search and sort to find your match.</p></div></section>
<section class="section"><div class="container">
  <div class="shop-bar mb-4">
  <div class="row g-3 align-items-center">
    <div class="col-md-8">
      <div class="search-box">
        <i class="bi bi-search"></i>
        <label class="visually-hidden" for="shopSearch">Search products</label>
        <input id="shopSearch" class="form-control" type="search" placeholder="Search products...">
      </div>
    </div>
    <div class="col-md-4">
      <label class="visually-hidden" for="sort">Sort products</label>
      <select id="sort" class="form-select">
        <option value="featured">Sort: Featured</option>
        <option value="low">Price: low to high</option>
        <option value="high">Price: high to low</option>
        <option value="rating">Top rated</option>
      </select>
    </div>
  </div>
  <div class="d-flex flex-wrap gap-2 mt-3" id="pills"></div>
</div>

  <p class="lead-muted" id="count" aria-live="polite"></p>
  <div class="row g-4" id="grid"></div></div></section>

</main>
<div id="site-footer"></div>
<div class="toast-container position-fixed bottom-0 end-0 p-3" id="toasts" style="z-index:1100"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
